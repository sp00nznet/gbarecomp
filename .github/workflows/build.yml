# Builds the recompiler on every push and PR, and runs the conformance
# harness, which reports SKIP here: it needs a ROM, and ROMs never reach CI.
# Game builds and the real conformance numbers come from the title repos.
name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Smoke test
        shell: bash
        run: |
          ./build/Release/gbarecomp.exe 2>&1 | grep -q "gbarecomp - GBA Static Recompilation Toolkit"
      - name: Conformance (SKIP without a ROM)
        shell: bash
        run: |
          python tools/conformance.py --exe none.exe --rom none.gba --baseline none.txt | tee /dev/stderr | grep -q "conformance: skipped"
